# ROI Configuration for SnitchSystem Edge Device
# Coordinates are in pixels relative to camera frame

# validator_roi: Bounding box where validator/tap machine is located
# Format: [x1, y1, x2, y2] where (x1,y1) is top-left, (x2,y2) is bottom-right
# Positioned well BEFORE gate line so person taps before crossing
# For down->up entry (bottom to top), ROI should be below gate line with good spacing
validator_roi:
  - 500   # x1 - left coordinate (centered horizontally)
  - 450   # y1 - top coordinate (90px buffer from gate line at y=360)
  - 800   # x2 - right coordinate (300px wide)
  - 700   # y2 - bottom coordinate (250px tall ROI below gate line)

# gate_line: Line coordinates just past barrier for gate crossing detection
# Format: [x1, y1, x2, y2] where (x1,y1) is start point, (x2,y2) is end point
# Horizontal line in the middle of the screen for down->up crossing validation
gate_line:
  - 0     # x1 - start x coordinate (left edge)
  - 360   # y1 - start y coordinate (middle of frame, ~720p)
  - 1280  # x2 - end x coordinate (right edge)
  - 360   # y2 - end y coordinate (horizontal line at middle)
