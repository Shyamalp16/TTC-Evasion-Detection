version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: snitch-postgres
    environment:
      POSTGRES_DB: snitchsystem
      POSTGRES_USER: snitch
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - snitch-network
    restart: unless-stopped

  server:
    build: .
    container_name: snitch-server
    environment:
      - SNITCH_DATABASE_URL=postgresql://snitch:password@postgres:5432/snitchsystem
      - SNITCH_API_HOST=0.0.0.0
      - SNITCH_API_PORT=8000
      - SNITCH_API_KEY=your-api-key-here
      - SNITCH_SECRET_KEY=your-secret-key-here
    volumes:
      - ./snapshots:/app/snapshots
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - snitch-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:alpine
    container_name: snitch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./snapshots:/var/www/snapshots
    depends_on:
      - server
    networks:
      - snitch-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  snitch-network:
    driver: bridge
